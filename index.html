<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      background-color: rgba(0, 0, 0, 0.75);
      /* Fondo semitransparente para OBS */
      padding: 15px;
      border-radius: 10px;
      width: 320px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      margin: 0;
    }

    h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
      color: #ffcc00;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .player-row {
      display: flex;
      justify-content: space-between;
      margin: 6px 0;
      font-size: 14px;
      font-weight: bold;
    }

    .my-stats {
      margin-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.3);
      padding-top: 10px;
      font-size: 14px;
      font-weight: bold;
      color: #00ffcc;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>

<body>
  <div id="widget">
    <h3>🏆 Top Setas - Eclipse</h3>
    <div id="top3">Cargando datos...</div>
    <div class="my-stats" id="mystats">Buscando a DiLANZiTO...</div>
  </div>

  <script>
    const NICKNAME = "DiLANZiTO";
    const API_URL = "https://eclipse.latampowerrust.com/stats/data.php?server=1";
    //const API_URL = "https://corsproxy.io/?" + encodeURIComponent( "https://eclipse.latampowerrust.com/stats/data.php?server=1" );

    async function actualizarDatos () {
      try {
        // Añadimos timestamp para evitar caché
        let response = await fetch( API_URL + "&_=" + new Date().getTime() );
        let data = await response.json();
        let jugadores = Array.isArray( data ) ? data : ( data.data || data.players || [] );

        // Ordenar por mushrooms_collected de mayor a menor
        jugadores.sort( ( a, b ) => ( parseInt( b.mushrooms_collected ) || 0 ) - ( parseInt( a.mushrooms_collected ) || 0 ) );

        // Renderizar Top 3
        let top3Html = "";
        let medallas = [ "🥇", "🥈", "🥉" ];
        for ( let i = 0; i < Math.min( 3, jugadores.length ); i++ ) {
          let p = jugadores[ i ];
          top3Html += `<div class="player-row"><span>${ medallas[ i ] } ${ p.name }</span> <span>${ p.mushrooms_collected } setas</span></div>`;
        }
        document.getElementById( "top3" ).innerHTML = top3Html;

        // Buscar tu posición
        let miIndex = jugadores.findIndex( p => p.name && p.name.toLowerCase() === NICKNAME.toLowerCase() );
        if ( miIndex !== -1 ) {
          let miP = jugadores[ miIndex ];
          document.getElementById( "mystats" ).innerHTML = `<span>👤 #${ miIndex + 1 } ${ miP.name }</span> <span>${ miP.mushrooms_collected } setas</span>`;
        } else {
          document.getElementById( "mystats" ).innerHTML = `<span>👤 ${ NICKNAME }</span> <span>No encontrado</span>`;
        }
      } catch ( e ) {
        console.log( "Error al sincronizar datos:", e );
      }
    }

    actualizarDatos();
    // Se actualiza automáticamente cada 20 segundos sin consumir recursos de tu PC
    setInterval( actualizarDatos, 20000 );
  </script>
</body>

</html>
