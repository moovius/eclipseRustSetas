<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rust Live Stats Leaderboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;600;800&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: transparent;
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      padding: 20px;
      color: #ffffff;
    }

    /* Contenedor Flex para mostrar ambos widgets */
    .overlay-container {
      display: flex;
      gap: 16px;
    }

    /* Tarjeta base con fondo purpora oscuro profundo */
    .glass-card {
      width: 320px;
      background: rgba(15, 12, 22, 0.75);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(224, 30, 130, 0.25);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6), 0 0 15px rgba(224, 30, 130, 0.1);
      position: relative;
      overflow: hidden;
    }

    /* Línea Neón brillante en el borde superior extraída de la pupila */
    .glass-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #ff007f, #d90429, transparent);
      box-shadow: 0 0 10px #ff007f;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ff2a8d;
      text-shadow: 0 0 12px rgba(255, 42, 141, 0.6);
    }

    .live-badge {
      font-size: 9px;
      font-weight: 800;
      background: rgba(255, 0, 127, 0.15);
      color: #ff70b8;
      border: 1px solid rgba(255, 0, 127, 0.4);
      padding: 2px 6px;
      border-radius: 20px;
      text-transform: uppercase;
      box-shadow: 0 0 8px rgba(255, 0, 127, 0.3);
    }

    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .player-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(35, 25, 48, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    .player-name {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: #e2e8f0;
    }

    .rank {
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px;
      font-weight: 700;
      width: 20px;
      text-align: center;
      flex-shrink: 0;
    }

    /* Puntuación en cuadro neón magenta */
    .score {
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      background: rgba(224, 30, 130, 0.2);
      border: 1px solid rgba(255, 42, 141, 0.4);
      padding: 2px 8px;
      border-radius: 6px;
      flex-shrink: 0;
      text-shadow: 0 0 6px rgba(255, 42, 141, 0.5);
    }

    .rank-1 {
      color: #ff007f;
      text-shadow: 0 0 8px #ff007f;
    }

    .rank-2 {
      color: #b8b8ff;
      text-shadow: 0 0 6px #b8b8ff;
    }

    .rank-3 {
      color: #8a5a83;
    }

    /* Tarjeta destacada para tu usuario con degradado magenta/azul frío */
    .my-stats-card {
      margin-top: 12px;
      padding: 8px 12px;
      background: linear-gradient(135deg, rgba(255, 0, 127, 0.25), rgba(74, 20, 140, 0.35));
      border: 1px solid rgba(255, 0, 127, 0.6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.25);
    }

    .my-stats-card .player-name {
      color: #ffffff;
      font-weight: 800;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
    }

    .my-stats-card .score {
      background: rgba(255, 0, 127, 0.35);
      color: #ffffff;
      border: 1px solid rgba(255, 0, 127, 0.8);
      box-shadow: 0 0 8px rgba(255, 0, 127, 0.4);
    }

    .glass-card.mushrooms {
      display: none;
    }
  </style>
</head>

<body>

  <div class="overlay-container">
    <!-- Panel de Setas -->
    <div class="glass-card mushrooms">
      <div class="header">
        <div class="title">🍄 Recolectores</div>
        <div class="live-badge">En Vivo</div>
      </div>
      <div class="leaderboard-list" id="top3-mushrooms">
        <div class="player-row"><span style="font-size: 12px; opacity: 0.6;">Cargando...</span></div>
      </div>
      <div class="my-stats-card" id="mystats-mushrooms">
        <div class="player-info">
          <span class="rank" style="color: #00f5d4;">#--</span>
          <span class="player-name">DiLANZiTO</span>
        </div>
        <div class="score">0</div>
      </div>
    </div>

    <!-- Panel de Kills PVP -->
    <div class="glass-card kills">
      <div class="header">
        <div class="title">⚔️ Asesinos PVP</div>
        <div class="live-badge">En Vivo</div>
      </div>
      <div class="leaderboard-list" id="top3-kills">
        <div class="player-row"><span style="font-size: 12px; opacity: 0.6;">Cargando...</span></div>
      </div>
      <div class="my-stats-card" id="mystats-kills">
        <div class="player-info">
          <span class="rank" style="color: #00f5d4;">#--</span>
          <span class="player-name">DiLANZiTO</span>
        </div>
        <div class="score">0</div>
      </div>
    </div>
  </div>

  <script>
    const NICKNAME = "DiLANZiTO";
    const WORKER_URL = "https://rust-stats-proxy.joanjspv.workers.dev";

    function obtenerNombreJugador ( p ) {
      let nombre = p.name || p.player_name || p.username || "Desconocido";
      return String( nombre ).trim();
    }

    // Render para el panel de Setas
    function renderizarSetas ( jugadores ) {
      let listaOrdenada = [ ...jugadores ].sort( ( a, b ) => ( parseInt( b.mushrooms_collected ) || 0 ) - ( parseInt( a.mushrooms_collected ) || 0 ) );

      let top3Html = "";
      let medallas = [ "🥇", "🥈", "🥉" ];
      let rankClasses = [ "rank-1", "rank-2", "rank-3" ];

      for ( let i = 0; i < Math.min( 3, listaOrdenada.length ); i++ ) {
        let p = listaOrdenada[ i ];
        let nombre = obtenerNombreJugador( p );
        let setas = parseInt( p.mushrooms_collected ) || 0;

        top3Html += `
            <div class="player-row">
                <div class="player-info">
                    <span class="rank ${ rankClasses[ i ] }">${ medallas[ i ] }</span>
                    <span class="player-name" title="${ nombre }">${ nombre }</span>
                </div>
                <div class="score">${ setas.toLocaleString() }</div>
            </div>
        `;
      }
      document.getElementById( "top3-mushrooms" ).innerHTML = top3Html;

      let miIndex = listaOrdenada.findIndex( p => obtenerNombreJugador( p ).toLowerCase() === NICKNAME.toLowerCase() );
      if ( miIndex !== -1 ) {
        let miP = listaOrdenada[ miIndex ];
        let misSetas = parseInt( miP.mushrooms_collected ) || 0;

        document.getElementById( "mystats-mushrooms" ).innerHTML = `
            <div class="player-info">
                <span class="rank" style="color: #00f5d4;">#${ miIndex + 1 }</span>
                <span class="player-name" title="${ obtenerNombreJugador( miP ) }">${ obtenerNombreJugador( miP ) }</span>
            </div>
            <div class="score">${ misSetas.toLocaleString() } setas</div>
        `;
      }
    }

    // Render para el panel de PVP (Orden por Kills, desempate por Menos Muertes)
    function renderizarKills ( jugadores ) {
      let listaOrdenada = [ ...jugadores ].map( p => ( {
        ...p,
        kills: parseInt( p.pvp_kills ) || 0,
        deaths: parseInt( p.pvp_deaths ) || 0
      } ) ).sort( ( a, b ) => {
        // 1. Prioridad: Mayor cantidad de Kills
        if ( b.kills !== a.kills ) {
          return b.kills - a.kills;
        }
        // 2. Desempate: Menor cantidad de Deaths (menos muertes va primero)
        return a.deaths - b.deaths;
      } );

      let top3Html = "";
      let medallas = [ "🥇", "🥈", "🥉" ];
      let rankClasses = [ "rank-1", "rank-2", "rank-3" ];

      for ( let i = 0; i < Math.min( 3, listaOrdenada.length ); i++ ) {
        let p = listaOrdenada[ i ];
        let nombre = obtenerNombreJugador( p );

        top3Html += `
            <div class="player-row">
                <div class="player-info">
                    <span class="rank ${ rankClasses[ i ] }">${ medallas[ i ] }</span>
                    <span class="player-name" title="${ nombre }">${ nombre }</span>
                </div>
                <div class="score" title="${ p.kills } Kills / ${ p.deaths } Muertes">
                    ${ p.kills } <span style="font-size:11px; opacity:0.65; font-weight: 400; font-family: 'Inter', sans-serif;">(${ p.deaths } d.)</span>
                </div>
            </div>
        `;
      }
      document.getElementById( "top3-kills" ).innerHTML = top3Html;

      let miIndex = listaOrdenada.findIndex( p => obtenerNombreJugador( p ).toLowerCase() === NICKNAME.toLowerCase() );
      if ( miIndex !== -1 ) {
        let miP = listaOrdenada[ miIndex ];

        document.getElementById( "mystats-kills" ).innerHTML = `
            <div class="player-info">
                <span class="rank" style="color: #00f5d4;">#${ miIndex + 1 }</span>
                <span class="player-name" title="${ obtenerNombreJugador( miP ) }">${ obtenerNombreJugador( miP ) }</span>
            </div>
            <div class="score">${ miP.kills } K | ${ miP.deaths } d.</div>
        `;
      }
    }

    async function actualizarDatos () {
      try {
        let response = await fetch( `${ WORKER_URL }?_=${ new Date().getTime() }` );
        if ( !response.ok ) throw new Error( `HTTP error! status: ${ response.status }` );

        let data = await response.json();
        let jugadores = Array.isArray( data ) ? data : ( data.data || data.players || [] );

        if ( jugadores.length === 0 ) return;

        renderizarSetas( jugadores );
        renderizarKills( jugadores );

      } catch ( e ) {
        console.log( "Error al refrescar datos:", e );
      }
    }

    actualizarDatos();
    setInterval( actualizarDatos, 20000 );
  </script>
</body>

</html>
